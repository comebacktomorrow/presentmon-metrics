name: build

# Builds the exporter on Windows (it's a net8.0-windows service): unit tests, then the
# self-contained single-file publish kiosk-presentmon installs. Every PR and push to main
# uploads the zip as an artifact; publishing a release attaches it and its sha256 to the
# release, which is what kiosk-presentmon's exporterVersion/exporterSha256 pin.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/KioskPresentMonExporter.Tests -c Release

      - name: Publish (self-contained single-file, win-x64)
        run: dotnet publish src/KioskPresentMonExporter -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Zip and sha256
        id: zip
        shell: pwsh
        run: |
          if (-not (Test-Path out/presentmon-metrics.exe)) { throw 'out/presentmon-metrics.exe missing: kiosk-presentmon expects it at the zip root' }
          Compress-Archive -Path out/* -DestinationPath presentmon-metrics-win-x64.zip
          $h = (Get-FileHash presentmon-metrics-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  presentmon-metrics-win-x64.zip" | Set-Content presentmon-metrics-win-x64.zip.sha256 -Encoding ascii
          Write-Host "sha256: $h"
          "### presentmon-metrics-win-x64.zip`n`nsha256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: presentmon-metrics-win-x64
          path: presentmon-metrics-win-x64.zip*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" presentmon-metrics-win-x64.zip presentmon-metrics-win-x64.zip.sha256 --clobber
